<style>

  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;color:#fff;line-height:1.7;-webkit-font-smoothing:antialiased;

a{color:inherit;text-decoration:none}
main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.box{width:100%;max-width:440px;text-align:center}
.check{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fbf1d6 0%,#e9cf8c 45%,#c9a24b 100%);box-shadow:0 0 0 10px rgba(201,162,75,.12),0 0 60px rgba(230,200,120,.3);color:var(--navy)}
.check svg{width:40px;height:40px}
h1{font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.08em;margin-top:28px}
p.lead{color:rgba(255,255,255,.75);font-size:15.5px;margin-top:10px}
p.lead b{color:var(--gold2);font-weight:600}
.btns{display:grid;gap:12px;margin-top:30px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;font-size:17px;font-weight:700;letter-spacing:.06em;transition:transform .15s}
.btn svg{width:20px;height:20px}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 12px 26px -10px rgba(201,162,75,.8)}
.btn-line{background:var(--line);color:#fff;box-shadow:0 12px 26px -10px rgba(6,199,85,.7)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.3);color:#fff;font-weight:600}
.sig{margin-top:30px;font-size:13px;color:rgba(255,255,255,.55)}
.sig b{display:block;color:#fff;font-family:var(--serif);font-size:16px;letter-spacing:.14em}
</style>
